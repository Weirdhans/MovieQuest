name: moviequest
description: "MovieQuest - Discover movies together with friends | Powered by Zenith Reborn"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend - Supabase (same as web app!)
  supabase_flutter: ^2.8.0

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # Swipe Cards - BEST choice for swipe functionality
  appinio_swiper: ^2.1.1

  # UI & Animations
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_dotenv: ^5.2.1
  youtube_player_iframe: ^5.2.1

  # Icons
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Riverpod code generation
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
    - assets/images/
