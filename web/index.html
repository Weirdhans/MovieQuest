<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MovieQuest - Discover movies together with friends">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MovieQuest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MovieQuest</title>
  <link rel="manifest" href="manifest.json">

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <script>
    // Configure Flutter to skip service worker registration
    // This prevents the service worker timeout error
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });

    // Prevent browser back/forward swipe gestures on edge of screen
    // This prevents accidental navigation when swiping near screen edges
    (function() {
      let startX = 0;
      const edgeThreshold = 50; // pixels from edge to block swipe

      // Use passive: false to allow preventDefault()
      document.addEventListener('touchstart', function(e) {
        startX = e.touches[0].pageX;

        // If touch starts near left or right edge, prevent navigation
        if (startX < edgeThreshold || startX > window.innerWidth - edgeThreshold) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchmove', function(e) {
        // If swipe started near edge, block the move event
        if (startX < edgeThreshold || startX > window.innerWidth - edgeThreshold) {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
